<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biodata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="bio.css" />
  </head>
  
  <body class="light">

    <!-- Headernya -->
    <header>
      <div class="logo">BENGKEL<span>Gweh</span></div>
      <button class="theme-toggle" id="theme-btn" aria-label="Toggle tema">
        🌙
      </button>
    </header>

    <!-- Bar Prosesnya -->
    <div class="progress-wrap">
      <div class="steps">
        <div class="step-item active" id="step-1">
          <div class="step-dot">1</div>
          <div class="step-label">Biodata</div>
        </div>
        <div class="step-item" id="step-2">
          <div class="step-dot">2</div>
          <div class="step-label">Layanan</div>
        </div>
        <div class="step-item" id="step-3">
          <div class="step-dot">3</div>
          <div class="step-label">Konfirmasi</div>
        </div>
        <div class="step-item" id="step-4">
          <div class="step-dot">4</div>
          <div class="step-label">Antrean</div>
        </div>
      </div>
    </div>

    <!-- Biodatanya -->
    <main>
      <div class="card">
        <div class="page active" id="page-1">
          <div class="card-title">Data Diri</div>
          <div class="card-sub">
            Isi data berikut untuk mendaftar antrean servis
          </div>

          <div class="field" id="f-nama">
            <label for="inp-nama">Nama Pelanggan</label>
            <input
              type="text"
              id="inp-nama"
              placeholder="Contoh: Anton Prasetyo"
              autocomplete="name"
            />
            <div class="err-msg">Nama tidak boleh kosong.</div>
          </div>

          <div class="field" id="f-hp">
            <label for="inp-hp">Nomor WhatsApp Aktif</label>
            <input
              type="tel"
              id="inp-hp"
              placeholder="08xxxxxxxxxx"
              maxlength="15"
            />
            <div class="err-msg">
              Masukkan nomor WhatsApp yang valid (min. 10 digit).
            </div>
          </div>

          <div class="field" id="f-plat">
            <label for="inp-plat">Plat Nomor Kendaraan</label>
            <input
              type="text"
              id="inp-plat"
              placeholder="Contoh: B 1234 ABC"
              style="text-transform: uppercase"
              maxlength="12"
            />
            <div class="plate-preview" id="plat-preview">— — —</div>
            <div class="err-msg">Masukkan plat nomor kendaraan.</div>
          </div>

          <div class="btn-group">
            <button class="btn btn-reset" onclick="resetForm()">Reset ↺</button>
            <button class="btn btn-primary" onclick="goToPage2()">Lanjut →</button>
          </div>
        </div>
      </div>
    </main>

    

    <footer>
      BengkelGweh — Pelanggan Panel &copy;
      <span id="year"></span>
    </footer>

    <script src="bio.js"></script>
  </body>
</html>
