<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konfirmasi — Bengkel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="confirm.css" />
    <link rel="icon" type="image/png" href="../../../logoBG.png"/>
  </head>

  <body class="light">
    <header>
      <div class="logo">
      <img src="../../../logo.png" height="70px" alt="logo"/>RIDER<span>Santuy</span>
      </div>
      <button class="theme-toggle" id="theme-btn" aria-label="Toggle tema">🌙</button>
    </header>

    <div class="progress-wrap">
      <div class="steps">
        <div class="step-item done" id="step-1">
          <div class="step-dot">1</div>
          <div class="step-label">Biodata</div>
        </div>
        <div class="step-item done" id="step-2">
          <div class="step-dot">2</div>
          <div class="step-label">Layanan</div>
        </div>
        <div class="step-item active" id="step-3">
          <div class="step-dot">3</div>
          <div class="step-label">Konfirmasi</div>
        </div>
        <div class="step-item" id="step-4">
          <div class="step-dot">4</div>
          <div class="step-label">Antrean</div>
        </div>
      </div>
    </div>

    <main>
      <div class="card">
        <div class="card-title">Konfirmasi</div>
        <div class="card-sub">Periksa kembali data Anda sebelum mengambil antrean</div>

        <div class="confirm-block">
          <h4>Data Pelanggan</h4>
          <div class="confirm-row">
            <span class="label">Nama</span>
            <span class="val" id="c-nama">—</span>
          </div>
          <div class="confirm-row">
            <span class="label">WhatsApp</span>
            <span class="val" id="c-hp">—</span>
          </div>
          <div class="confirm-row">
            <span class="label">Plat Nomor</span>
            <span class="val" id="c-plat" style="font-family: 'Oswald', sans-serif; letter-spacing: 0.1em;">—</span>
          </div>
        </div>

        <div class="confirm-block">
          <h4>Layanan Dipilih</h4>
          <div class="svc-confirm-list" id="c-svc-list"></div>
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary" onclick="window.history.back()">← Kembali</button>
          <button class="btn btn-primary" onclick="submitQueue()">Ambil Antrean ✓</button>
        </div>
      </div>
    </main>

    <footer>
      RiderSantuy — Pelanggan Panel &copy; <span id="year"></span>
    </footer>

    <script src="../../../js/api.js"></script>
    <script src="confirm.js"></script>
  </body>
</html>
