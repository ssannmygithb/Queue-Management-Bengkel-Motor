<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antrean — Bengkel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="antrian.css" />
  </head>

  <body class="light">
    <header>
      <div class="logo">BENGKEL<span>Gweh</span></div>
      <button class="theme-toggle" id="theme-btn" aria-label="Toggle tema">🌙</button>
    </header>

    <div class="progress-wrap">
      <div class="steps">
        <div class="step-item done" id="step-1">
          <div class="step-dot">1</div>
          <div class="step-label">Biodata</div>
        </div>
        <div class="step-item done" id="step-2">
          <div class="step-dot">2</div>
          <div class="step-label">Layanan</div>
        </div>
        <div class="step-item done" id="step-3">
          <div class="step-dot">3</div>
          <div class="step-label">Konfirmasi</div>
        </div>
        <div class="step-item done" id="step-4">
          <div class="step-dot">4</div>
          <div class="step-label">Antrean</div>
        </div>
      </div>
    </div>

    <main>
      <div class="card">
        <div class="card-title">Antrean Berhasil!</div>
        <div class="card-sub">Notifikasi akan dikirim ke WhatsApp Anda</div>

        <div class="queue-number-wrap">
          <div class="queue-label">Nomor Antrean</div>
          <div class="queue-number" id="q-number">—</div>
        </div>

        <div class="queue-info-row">
          <div class="queue-info-box">
            <div class="qib-label">Nama</div>
            <div class="qib-val" id="q-nama">—</div>
          </div>
          <div class="queue-info-box">
            <div class="qib-label">Plat</div>
            <div class="qib-val" id="q-plat">—</div>
          </div>
        </div>

        <div class="confirm-block">
          <h4>Layanan Anda</h4>
          <div class="svc-confirm-list" id="q-svc-list"></div>
        </div>

        <button class="btn btn-primary" onclick="daftarBaru()">Daftar Antrean Baru</button>
      </div>
    </main>

    <footer>
      BengkelGweh — Pelanggan Panel &copy; <span id="year"></span>
    </footer>

    <script src="antrian.js"></script>
  </body>
</html>
